openapi: 3.0.0
info:
  version: 2.0.0
  title: Pagopa eCommerce payment transactions service
  description: This microservice handles transaction's lifecycle and workflow.
  contact:
    name: pagoPA - Touchpoints team
    url: https://www.pagopa.it/
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12
servers:
  - url: https://${host}/transactions-service
    x-internal: true # required by owasp:api9:2023-inventory-access
    variables:
      host:
        description: The hostname of the API server
        default: weuprod.ecommerce.internal.platform.pagopa.it
        enum:
          - weudev.ecommerce.internal.dev.platform.pagopa.it
          - weuuat.ecommerce.internal.uat.platform.pagopa.it
          - weuprod.ecommerce.internal.platform.pagopa.it
tags:
  - name: transactions
    description: Api's for performing a transaction
    externalDocs:
      url: https://pagopa.atlassian.net/wiki/spaces/I/pages/611287199/-servizio+transactions+service
      description: Technical specifications
externalDocs:
  url: https://pagopa.atlassian.net/wiki/spaces/I/pages/492339720/pagoPA+eCommerce+Design+Review
  description: Design review
security:
  - ApiKeyAuth: [ ]
paths:
  /v2/transactions/{transactionId}:
    get:
      tags:
        - transactions
      operationId: getTransactionInfo
      summary: Get transaction information
      description: Return information for the input specific transaction resource
      parameters:
        - in: header
          name: x-user-id
          required: false
          description: User id (valued for authenticated payments) owner of the transaction
          schema:
            $ref: '#/components/schemas/UserId'
        - in: path
          name: transactionId
          required: true
          description: Transaction ID
          schema:
            $ref: '#/components/schemas/TransactionID'
      responses:
        '200':
          description: Transaction data successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionInfo"
        '400':
          description: Invalid transaction id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 401
                detail: Unauthorized
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
  /v2/transactions/{transactionId}/auth-requests:
    patch:
      tags:
        - transactions
      operationId: updateTransactionAuthorization
      summary: Update authorization
      description: Callback endpoint used for notify authorization outcome
      parameters:
        - in: path
          name: transactionId
          required: true
          description: Transaction ID
          schema:
            $ref: '#/components/schemas/TransactionID'
      requestBody:
        $ref: "#/components/requestBodies/UpdateAuthorizationRequest"
      responses:
        '200':
          description: Transaction authorization request successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAuthorizationResponse"
        '400':
          description: Invalid transaction id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 401
                detail: Unauthorized
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
        '502':
          description: Bad gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
components:
  schemas:
    RptId:
      description: Digital payment receipt identifier
      type: string
      pattern: '([a-zA-Z\d]{1,35})|(RF\d{2}[a-zA-Z\d]{1,21})'
    PaymentInfo:
      description: Informations about transaction payments
      type: object
      properties:
        paymentToken:
          type: string
        rptId:
          $ref: '#/components/schemas/RptId'
        reason:
          type: string
        amount:
          $ref: '#/components/schemas/AmountEuroCents'
        transferList:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'
          minItems: 1
          maxItems: 5
        isAllCCP:
          type: boolean
          description: Flag for poste psp enabling in gec request
        creditorReferenceId:
          type: string
          description: Creditor notice number's
      required:
        - rptId
        - amount
        - transferList
        - isAllCCP
      example:
        rptId: "77777777777302012387654312384"
        paymentToken: "paymentToken1"
        reason: "reason1"
        amount: 600
        isAllCCP: false
        transferList:
          - paFiscalCode: "77777777777"
            digitalStamp: false
            transferCategory: "transferCategory1"
            transferAmount: 500
          - paFiscalCode: "11111111111"
            digitalStamp: true
            transferCategory: "transferCategory2"
            transferAmount: 100
    AmountEuroCents:
      description: Amount for payments, in euro cents
      type: integer
      format: int64
      minimum: 0
      maximum: 99999999999
    FeeEuroCents:
      description: Fee for payments, in euro cents
      type: integer
      format: int32
    TransactionStatus:
      type: string
      description: Possible statuses a transaction can be in
      enum:
        - ACTIVATED
        - AUTHORIZATION_REQUESTED
        - AUTHORIZATION_COMPLETED
        - CLOSURE_REQUESTED
        - CLOSED
        - CLOSURE_ERROR
        - NOTIFIED_OK
        - NOTIFIED_KO
        - NOTIFICATION_ERROR
        - NOTIFICATION_REQUESTED
        - EXPIRED
        - REFUNDED
        - CANCELED
        - EXPIRED_NOT_AUTHORIZED
        - UNAUTHORIZED
        - REFUND_ERROR
        - REFUND_REQUESTED
        - CANCELLATION_REQUESTED
        - CANCELLATION_EXPIRED
    UserId:
      description: unique user identifier
      type: string
      format: uuid
    TransactionID:
      description: Base64 of bytes related to TransactionId
      type: string
    Transfer:
      type: object
      description: The dto that contains information about the creditor entities
      properties:
        paFiscalCode:
          type: string
          description: The creditor institution fiscal code
          pattern: '^[a-zA-Z0-9]{11}'
        digitalStamp:
          type: boolean
          description: True if it is a digital stamp. False otherwise
        transferCategory:
          type: string
          description: The taxonomy of the transfer
        transferAmount:
          $ref: '#/components/schemas/AmountEuroCents'
      required:
        - paFiscalCode
        - digitalStamp
        - transferAmount
    ProblemJson:
      description: Body definition for error responses containing failure details
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |-
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          default: about:blank
          example: https://example.com/problem/constraint-violation
        title:
          type: string
          description: |-
            A short, summary of the problem type. Written in english and readable
            for engineers (usually not suited for non technical stakeholders and
            not localized); example: Service Unavailable
        status:
          $ref: "#/components/schemas/HttpStatusCode"
        detail:
          type: string
          description: |-
            A human readable explanation specific to this occurrence of the
            problem.
          example: There was an error processing the request
        instance:
          type: string
          format: uri
          description: |-
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    HttpStatusCode:
      type: integer
      format: int32
      description: |-
        The HTTP status code generated by the origin server for this occurrence
        of the problem.
      minimum: 100
      maximum: 600
      exclusiveMaximum: true
      example: 200
    TransactionInfo:
      description: Transaction data returned when querying for an existing transaction
      type: object
      properties:
        transactionId:
          type: string
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInfo'
          minItems: 1
          maxItems: 5
          example:
            - rptId: '77777777777302012387654312384'
              paymentToken: paymentToken1
              reason: reason1
              amount: 600
              isAllCCP: false
              transferList:
                - paFiscalCode: '77777777777'
                  digitalStamp: false
                  transferCategory: transferCategory1
                  transferAmount: 500
                - paFiscalCode: '11111111111'
                  digitalStamp: true
                  transferCategory: transferCategory2
                  transferAmount: 100
        status:
          $ref: '#/components/schemas/TransactionStatus'
        feeTotal:
          $ref: '#/components/schemas/FeeEuroCents'
        idCart:
          description: Cart identifier provided by creditor institution
          type: string
          example: idCartFromCreditorInstitution
        clientId:
          description: transaction client id
          type: string
          enum:
            - IO
            - CHECKOUT
            - CHECKOUT_CART
            - UNKNOWN
        nodeInfo:
          type: object
          description: Node operation info
          properties:
            closePaymentResultError:
              type: object
              description: Error details for close payment result
              properties:
                statusCode:
                  description: Status code (4xx, 5xx) of the error received on the node
                  type: number
                description:
                  description: Description of the error received on the node
                  type: string
            sendPaymentResultOutcome:
              description: The outcome of sendPaymentResult api (OK, KO, NOT_RECEIVED)
              type: string
              enum:
                - OK
                - KO
                - NOT_RECEIVED
        gatewayInfo:
          type: object
          description: Gateway info
          properties:
            gateway:
              type: string
              pattern: NPG|REDIRECT
              description: Payment gateway identifier
            authorizationStatus:
              type: string
              description: Payment gateway authorization status
            authorizationCode:
              type: string
              description: Payment gateway-specific authorization code related to the transaction
            errorCode:
              type: string
              description: Payment gateway-specific error code from the gateway
      required:
        - status
        - transactionId
        - payments
    UpdateAuthorizationResponse:
      type: object
      description: Update authorization response
      properties:
        status:
          $ref: '#/components/schemas/TransactionStatus'
      required:
        - status
    UpdateAuthorizationRequest:
      type: object
      description: Request body for updating an authorization for a transaction
      properties:
        outcomeGateway:
          type: object
          oneOf:
            - $ref: '#/components/schemas/OutcomeNpgGateway'
            - $ref: '#/components/schemas/OutcomeRedirectGateway'
          discriminator:
            propertyName: paymentGatewayType
            mapping:
              NPG: '#/components/schemas/OutcomeNpgGateway'
              REDIRECT: '#/components/schemas/OutcomeRedirectGateway'
        timestampOperation:
          type: string
          format: date-time
          description: Payment timestamp
      required:
        - outcomeGateway
        - timestampOperation
        - GENERIC_ERROR
    OutcomeNpgGateway:
      type: object
      properties:
        paymentGatewayType:
          type: string
          example: 'NPG'
        operationResult:
          type: string
          description: outcome received by NPG - https://developer.nexi.it/it/api/notifica
          enum:
            - AUTHORIZED
            - EXECUTED
            - DECLINED
            - DENIED_BY_RISK
            - THREEDS_VALIDATED
            - THREEDS_FAILED
            - PENDING
            - CANCELED
            - VOIDED
            - REFUNDED
            - FAILED
        orderId:
          description: Operator unique order ID
          type: string
        operationId:
          description: Operation ID
          type: string
        authorizationCode:
          type: string
          description: Authorization code
        errorCode:
          type: string
          description: Error code
        paymentEndToEndId:
          description: Circuit unique transaction ID
          type: string
        rrn:
          description: Transaction rrn
          type: string
        validationServiceId:
          description: Validation service id
          type: string
        cardId4:
          description: NPG unique card identifier
          type: string
      required:
        - paymentGatewayType
        - operationResult
    OutcomeRedirectGateway:
      type: object
      properties:
        paymentGatewayType:
          type: string
          example: REDIRECT
          description: disciminator field. fixed value `REDIRECT`
        pspTransactionId:
          type: string
          description: PSP transaction unique ID
        outcome:
          $ref: 'https://raw.githubusercontent.com/pagopa/pagopa-api/SANP3.6.1/openapi/redirect.yaml#/components/schemas/AuthorizationOutcome'
        pspId:
          type: string
          description: PSP ID from which the authorization outcome request come
        authorizationCode:
          type: string
          description: payment authorization code
        errorCode:
          type: string
          description: payment error code
      required:
        - paymentGatewayType
        - pspId
        - outcome
        - pspTransactionId
  requestBodies:
    UpdateAuthorizationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateAuthorizationRequest"
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: api key authentication
